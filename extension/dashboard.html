<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>公司记录看板 · BOSS 助手</title><link rel="stylesheet" href="dashboard.css"><script type="module" src="dashboard.js"></script></head>
<body><header><div><span class="eyebrow">BOSS 助手 / 本机数据</span><h1>公司记录看板</h1><p>看过哪些公司，沟通进展如何，一目了然。</p></div><span id="sync" role="status">正在读取记录…</span></header>
<main><section class="metrics" aria-label="记录概览"><div><span>已记录公司</span><strong id="total">—</strong><small>当前保留的公司</small></div><div><span>已采集岗位</span><strong id="jobs-total">—</strong><small id="jobs-total-note">当前保留的岗位</small></div><div><span>已标记沟通</span><strong id="contacted">—</strong><small>公司数</small></div><div><span>尚未标记沟通</span><strong id="uncontacted">—</strong><small>不代表从未沟通</small></div><div><span>沟通标记占比</span><strong id="rate">—</strong><small>已沟通 / 已记录</small></div></section>
<div id="error" role="alert" hidden></div><div class="analysis"><section><div class="section-title"><div><span class="eyebrow">记录走势</span><h2>按日期查看</h2></div><label>统计周期 <select id="period"><option value="day">按天</option><option value="week">按周</option></select></label></div><p class="note">上海时间，按当前保留记录的首次记录日期及当前沟通标记日期统计，最多显示最近14个有记录的周期。</p><div id="trend"></div></section><section><div class="section-title"><div><span class="eyebrow">休息制度</span><h2>公司分布</h2></div></div><p class="note">未识别的公司单独统计。</p><div id="rest"></div></section></div>
<section class="records"><div class="section-title"><div><span class="eyebrow">公司清单</span><h2>我的记录 <span id="count"></span></h2></div></div><div class="filters"><label>公司名称<input id="search" type="search" placeholder="搜索公司"></label><label>沟通状态<select id="contact-filter"><option value="all">全部</option><option value="yes">已沟通</option><option value="no">未标记沟通</option></select></label><label>休息制度<select id="rest-filter"><option value="all">全部</option></select></label></div><div class="table-wrap"><table><thead><tr><th>公司</th><th>首次记录</th><th>沟通状态</th><th>沟通标记时间</th><th>休息制度</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="note" hidden></p></section><p class="footnote">仅统计当前保留的记录；撤销公司或取消沟通后，历史统计会相应变化。数据仅保存在本机。</p></main></body></html>
